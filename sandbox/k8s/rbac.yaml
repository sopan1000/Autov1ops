# Least-privilege RBAC for the Google service account used by the Cloud Run agent.
# Apply after the GKE cluster exists. The identity is the Google service-account
# email, not a Kubernetes ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autoops-agent-remediator
  namespace: autoops-sandbox
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autoops-agent-remediator
  namespace: autoops-sandbox
subjects:
  - kind: User
    name: REPLACE_WITH_AUTOOPS_AGENT_SERVICE_ACCOUNT_EMAIL
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: autoops-agent-remediator
  apiGroup: rbac.authorization.k8s.io
