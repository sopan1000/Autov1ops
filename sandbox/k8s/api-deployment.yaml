apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: autoops-sandbox
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: gcr.io/PROJECT_ID/autoops-sandbox-api:latest
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: api-config}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 15
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "250m", memory: "256Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: autoops-sandbox
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8080}]
  type: ClusterIP
