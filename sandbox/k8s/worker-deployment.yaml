apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: autoops-sandbox
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: gcr.io/PROJECT_ID/autoops-sandbox-worker:v2.2
          env:
            - {name: IMAGE_TAG, value: "worker:v2.2"}
            - {name: FEATURE_X_FLAG, value: "true"}
            - {name: LEAK_MEMORY, value: "false"}
            - {name: LEAK_DB_CONNECTIONS, value: "false"}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "250m", memory: "1Gi"}
