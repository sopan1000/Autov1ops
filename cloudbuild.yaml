# Rebuilds the agent image and rolls it out to an EXISTING Cloud Run service,
# keeping its current env vars and secrets. Create the service first with
# the one-command deploy in docs/DEPLOY.md.
#
#   gcloud builds submit --config cloudbuild.yaml .
#
# Uses $BUILD_ID for the tag ($SHORT_SHA is empty for manual submits).
substitutions:
  _REGION: us-central1
  _REPO: cloud-run-source-deploy   # created automatically by `gcloud run deploy --source`
  _SERVICE: autoops-agent

steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID", "."]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID"
      - "--region=${_REGION}"

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID"
