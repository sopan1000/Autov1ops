# `docker-compose up` runs the full demo locally on fixture data.
#   Offline (no setup):  docker-compose up --build
#   With real Gemini:    USE_REAL_GEMINI=true GOOGLE_API_KEY=<AI Studio key> docker-compose up --build
# Dashboard: http://localhost:3000 (or http://localhost:8000/ui)
services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MOCK_TOOLS: "true"
      STORE_BACKEND: "local"
      USE_REAL_GEMINI: "${USE_REAL_GEMINI:-false}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      AUTO_REMEDIATE: "${AUTO_REMEDIATE:-false}"
      GEMINI_RPM: "${GEMINI_RPM:-0}"
      GEMINI_THINKING_LEVEL: "${GEMINI_THINKING_LEVEL:-low}"
      LOCAL_DB_PATH: "agent/data/db.json"
      CORS_ORIGINS: "http://localhost:3000"
    volumes:
      - ./agent/data:/app/agent/data

  dashboard:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    depends_on:
      - agent
