name: AutoOps CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r agent/requirements.txt
      - name: Compile
        run: PYTHONPATH=. python -m compileall -q agent tests
      - name: Tests
        run: PYTHONPATH=. pytest -q
      - name: Build image
        run: docker build .
